<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.js"></script>
    <title>World Clock by Debbie Hunter</title>
  </head>
  <body>
    <div class="container">

      <h1>🕒 World Clock 🕤</h1>

      
      <select id="city-select">
        <option value="">-Choose a city...-</option>
        <option value="">Current Location</option>
        <option value="Europe/London">London</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="America/New_York">New York</option>
      </select>

      <div id="cities">
        <div class="city" id="moscow">
          <div><h2>Moscow</h2>
          <div class="date"></div></div>
          <div class="time"></div>
        </div>
        <div class="city" id="paris">
         <div> <h2>Paris</h2>
          <div class="date"></div></div>
          <div class="time"></div>
        </div>
        <div class="city" id="sydney">
          <div><h2>Sydney</h2>
          <div class="date"></div></div>
          <div class="time"></div>
      
    </div>
    </div>
    <footer>
      This project was coded by 💞<strong>Debbie Hunter</strong>, is
      <a href="https://github.com/debbihunter/world-clock" target="_blank"
        >open sourced on GitHub.</a
      >      
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
