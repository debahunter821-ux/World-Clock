<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.js"></script>
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>🕒 World Clock 🕤</h1>
      <select>
        <option value="">-Choose a city...-</option>
        <option value="">Current Location</option>
        <option value="">London</option>
        <option value="">Tokyo</option>
        <option value="">New York</option>
      </select>
      <div class="city">
        <div><h2>Moscow</h2>
        <div class="date">21 July 2026</div></div>
        <div class="time">12:00:00<small>am</small></div>
      </div>
      <div class="city">
       <div> <h2>Paris</h2>
        <div class="date">21 July 2026</div></div>
        <div class="time">12:00:00<small>am</small></div>
      </div>
      <div class="city">
        <div><h2>Sydney</h2>
        <div class="date">21 July 2026</div></div>
        <div class="time">12:00:00<small>am</small></div>
    </div>
    <footer>
      This project was coded by 💞<strong>Debbie Hunter</strong>, is
      <a href="https://github.com/debbihunter/world-clock" target="_blank"
        >open sourced on GitHub.</a
      >
      
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
